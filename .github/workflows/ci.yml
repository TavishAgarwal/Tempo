name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.11 backend/.venv && uv pip install --python backend/.venv/bin/python -e "backend[dev]"
      - run: cd backend && .venv/bin/ruff check taqpso tests experiments && .venv/bin/mypy && .venv/bin/lint-imports
      - run: cd backend && ! grep -rn "exp(" taqpso/solver/keys.py taqpso/solver/split*.py
      - run: cd backend && ! grep -rEn "np\.random\.(seed|rand|randn|randint|random)\(|^import random|from random " taqpso
      - run: cd backend && NUMBA_NUM_THREADS=1 .venv/bin/python -m pytest -m "not slow"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: lts/* }
      - run: cd frontend && npm ci && npx tsc --noEmit && npm run lint && npm run build
